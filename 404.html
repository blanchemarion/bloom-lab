<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <meta http-equiv="refresh" content="0; url=/" />
    <script>
      // This script makes GitHub Pages single-page-app friendly.

      // 1. Get the current path, like /projects/biological-relativity
      var path = window.location.pathname;

      // 2. Build a query string marker so the app can read it
      // We'll redirect to "/?redirect=/projects/biological-relativity"
      var redirectUrl = "/?redirect=" + encodeURIComponent(path);

      // 3. Actually redirect
      window.location.replace(redirectUrl);
    </script>
  </head>
  <body>
    Redirecting…
  </body>
</html>
